name: Production form smoke test

on:
  schedule:
    - cron: "15 14 * * *"
  workflow_dispatch:

jobs:
  production-forms:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRODUCTION_TEST_URL: ${{ secrets.PRODUCTION_TEST_URL }}
      PRODUCTION_TEST_EMAIL: ${{ secrets.PRODUCTION_TEST_EMAIL }}
      PRODUCTION_TEST_PHONE: ${{ secrets.PRODUCTION_TEST_PHONE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:production-form
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-form-failure
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
      - name: Email failure alert
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.PRODUCTION_TEST_ALERT_RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.PRODUCTION_TEST_ALERT_FROM_EMAIL }}
          ALERT_EMAIL: ${{ secrets.PRODUCTION_TEST_ALERT_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          test -n "$RESEND_API_KEY" && test -n "$RESEND_FROM_EMAIL" && test -n "$ALERT_EMAIL"
          curl --fail-with-body --request POST https://api.resend.com/emails \
            --header "Authorization: Bearer $RESEND_API_KEY" \
            --header "Content-Type: application/json" \
            --data "{\"from\":\"$RESEND_FROM_EMAIL\",\"to\":[\"$ALERT_EMAIL\"],\"subject\":\"Production form test failed\",\"html\":\"<p>A production form smoke test failed.</p><p><a href='$RUN_URL'>View the failed run</a></p>\"}"
